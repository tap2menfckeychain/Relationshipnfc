<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Thiệp Cá Nhân</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 20px auto;
        padding: 20px;
        background: #f0f2f5;
      }
      .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #c4687a;
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 14px;
        font-weight: bold;
        font-size: 14px;
      }
      input,
      textarea,
      button {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
      }
      button {
        background: #c4687a;
        color: white;
        border: none;
        font-weight: bold;
        margin-top: 15px;
        cursor: pointer;
        font-size: 15px;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
      }
      .preview-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .thumb {
        position: relative;
        width: 70px;
        height: 70px;
      }
      .thumb img {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ddd;
      }
      .thumb .del,
      .mini-btn {
        width: 20px;
        height: 20px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        font-size: 12px;
        line-height: 20px;
        background: #333;
      }
      .thumb .del {
        position: absolute;
        top: -6px;
        right: -6px;
      }
      .section {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed #ddd;
      }
      .section h3 {
        margin: 0;
        font-size: 15px;
        color: #9e3148;
      }
      audio {
        width: 100%;
        margin-top: 8px;
      }
      #audioBox {
        display: none;
      }
      #audioBox .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #audioName {
        font-size: 13px;
        flex: 1;
        word-break: break-all;
      }
      #result {
        margin-top: 15px;
        padding: 12px;
        background: #eccc68;
        border-radius: 6px;
        display: none;
        word-break: break-all;
        font-size: 14px;
      }
      #copyBtn {
        background: #2f3542;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Tạo Thiệp Cá Nhân</h2>
      <form id="uploadForm">
        <label>Tên của bạn (người gửi):</label>
        <input type="text" id="senderName" maxlength="40" required />

        <label>Tên người nhận (bạn thân / người ấy):</label>
        <input type="text" id="receiverName" maxlength="40" />

        <label>Ngày kỷ niệm (không bắt buộc):</label>
        <input type="date" id="eventDate" />

        <label>Lời nhắn:</label>
        <textarea id="message" rows="4" maxlength="600" required></textarea>

        <div class="section">
          <h3>📷 Ảnh kỷ niệm</h3>
          <input type="file" id="imageInput" accept="image/*" multiple />
          <div class="hint" id="countHint">
            Đã chọn 0/6 ảnh (có thể chọn từng ảnh một)
          </div>
          <div class="preview-list" id="previewList"></div>
        </div>

        <div class="section">
          <h3>🎵 Nhạc nền (không bắt buộc)</h3>
          <input type="file" id="audioInput" accept="audio/*,.mp3,.m4a" />
          <div class="hint">
            Chọn file nhạc (mp3, tối đa 15MB). Không chọn thì dùng bài mặc định
            của thiệp.
          </div>

          <div id="audioBox">
            <div class="row">
              <span id="audioName"></span>
              <button type="button" class="mini-btn" id="audioDel" title="Bỏ nhạc">
                ×
              </button>
            </div>
            <audio id="audioPreview" controls></audio>

            <label>Tên bài hát hiển thị trên thiệp:</label>
            <input
              type="text"
              id="songName"
              maxlength="60"
              placeholder="VD: Photograph – Ed Sheeran"
            />
          </div>
        </div>

        <button type="submit" id="btnSubmit">Tạo Link Thiệp</button>
      </form>

      <div id="result">
        <strong>Link thiệp riêng của khách:</strong><br />
        <a id="cardLink" href="#" target="_blank" rel="noopener"></a>
        <div class="hint" id="lenInfo"></div>
        <button type="button" id="copyBtn">Sao chép link</button>
      </div>
    </div>

    <script>
      // ====== THÔNG TIN CLOUDINARY (preset phải ở chế độ Unsigned) ======
      const CLOUD_NAME = "yx8ugl6f";
      const UPLOAD_PRESET = "Relationship";
      const MAX_IMAGES = 6;
      const MAX_AUDIO_MB = 15;

      const $ = (id) => document.getElementById(id);

      /* ---------------- ẢNH ---------------- */
      let selectedImages = [];

      function renderPreview() {
        $("previewList").innerHTML = "";
        selectedImages.forEach((file, idx) => {
          const wrap = document.createElement("div");
          wrap.className = "thumb";

          const img = document.createElement("img");
          img.src = URL.createObjectURL(file);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "×";
          del.title = "Bỏ ảnh này";
          del.addEventListener("click", () => {
            selectedImages.splice(idx, 1);
            renderPreview();
          });

          wrap.append(img, del);
          $("previewList").appendChild(wrap);
        });
        $("countHint").textContent =
          `Đã chọn ${selectedImages.length}/${MAX_IMAGES} ảnh (có thể chọn từng ảnh một)`;
      }

      $("imageInput").addEventListener("change", (e) => {
        for (const file of Array.from(e.target.files)) {
          if (selectedImages.length >= MAX_IMAGES) {
            alert(`Chỉ được chọn tối đa ${MAX_IMAGES} ảnh.`);
            break;
          }
          selectedImages.push(file);
        }
        $("imageInput").value = "";
        renderPreview();
      });

      // Thu nhỏ ảnh (cạnh dài tối đa 1600px) cho tải nhanh & không vượt giới hạn của Cloudinary
      async function shrinkImage(file) {
        try {
          const bmp = await createImageBitmap(file);
          const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(bmp.width * scale);
          canvas.height = Math.round(bmp.height * scale);
          canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise((ok) =>
            canvas.toBlob(ok, "image/jpeg", 0.85),
          );
          return blob || file;
        } catch {
          return file; // định dạng trình duyệt không đọc được (vd HEIC) -> gửi nguyên bản
        }
      }

      /* ---------------- NHẠC ---------------- */
      let selectedAudio = null;
      let audioUrl = null;

      function clearAudio() {
        selectedAudio = null;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = null;
        $("audioPreview").removeAttribute("src");
        $("audioBox").style.display = "none";
        $("songName").value = "";
        $("audioInput").value = "";
      }

      $("audioInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > MAX_AUDIO_MB * 1024 * 1024) {
          alert(`File nhạc quá lớn (tối đa ${MAX_AUDIO_MB}MB).`);
          clearAudio();
          return;
        }
        selectedAudio = file;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(file);
        $("audioPreview").src = audioUrl;
        $("audioName").textContent = file.name;
        $("songName").value = file.name.replace(/\.[^.]+$/, "");
        $("audioBox").style.display = "block";
      });
      $("audioDel").addEventListener("click", clearAudio);

      /* ---------------- UPLOAD ---------------- */
      async function uploadToCloudinary(fileOrBlob, resourceType, filename) {
        const formData = new FormData();
        formData.append("file", fileOrBlob, filename);
        formData.append("upload_preset", UPLOAD_PRESET);

        const res = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`,
          { method: "POST", body: formData },
        );
        const data = await res.json();
        if (!data.public_id) {
          throw new Error(
            (data.error && data.error.message) || "không rõ nguyên nhân",
          );
        }
        // Chỉ lưu đường dẫn gọn để link ngắn: v<version>/<public_id>.<định dạng>
        return `v${data.version}/${data.public_id}.${data.format}`;
      }

      // UTF-8 -> base64url (ngắn gọn, an toàn trên URL)
      function encodePayload(obj) {
        const bytes = new TextEncoder().encode(JSON.stringify(obj));
        let bin = "";
        bytes.forEach((b) => (bin += String.fromCharCode(b)));
        return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      $("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (selectedImages.length === 0) {
          alert("Vui lòng chọn ít nhất 1 tấm ảnh!");
          return;
        }

        const btn = $("btnSubmit");
        btn.disabled = true;

        try {
          // 1. Ảnh
          const imagePaths = [];
          for (let i = 0; i < selectedImages.length; i++) {
            btn.innerText = `Đang tải ảnh ${i + 1}/${selectedImages.length}...`;
            const small = await shrinkImage(selectedImages[i]);
            try {
              imagePaths.push(await uploadToCloudinary(small, "image", `anh${i + 1}.jpg`));
            } catch (err) {
              throw new Error(`Ảnh ${i + 1} tải lỗi: ${err.message}`);
            }
          }

          // 2. Nhạc (nếu có) – Cloudinary xếp file âm thanh vào nhóm "video"
          let audioPath = "";
          if (selectedAudio) {
            btn.innerText = "Đang tải nhạc...";
            try {
              audioPath = await uploadToCloudinary(selectedAudio, "video", selectedAudio.name);
            } catch (err) {
              throw new Error(`Nhạc tải lỗi: ${err.message}`);
            }
          }

          // 3. Gom dữ liệu -> link
          const payload = {
            n: $("senderName").value.trim(),
            n2: $("receiverName").value.trim(),
            m: $("message").value.trim(),
            d: $("eventDate").value, // YYYY-MM-DD hoặc ""
            i: imagePaths,
          };
          if (audioPath) {
            payload.a = audioPath;
            payload.s = $("songName").value.trim();
          }
          // Bỏ các trường trống cho link ngắn hơn
          Object.keys(payload).forEach((k) => {
            if (payload[k] === "") delete payload[k];
          });

          const base = new URL("index.html", window.location.href).href;
          const finalUrl = `${base}?data=${encodePayload(payload)}`;

          $("cardLink").href = finalUrl;
          $("cardLink").innerText = finalUrl;
          $("lenInfo").textContent =
            `Độ dài link: ${finalUrl.length} ký tự (chip NFC cần đủ dung lượng để ghi link này).`;
          $("result").style.display = "block";
        } catch (err) {
          alert("Lỗi: " + err.message);
        } finally {
          btn.disabled = false;
          btn.innerText = "Tạo Link Thiệp";
        }
      });

      $("copyBtn").addEventListener("click", async () => {
        const url = $("cardLink").href;
        try {
          await navigator.clipboard.writeText(url);
          alert("Đã sao chép link!");
        } catch {
          prompt("Hãy sao chép link bên dưới:", url);
        }
      });
    </script>
  </body>
</html>
